[terminal.shell]
program = "/usr/bin/fish"

[font]
normal.family = "CaskaydiaCove Nerd Font Mono"
normal.style = "Regular"
size = 13.0

# Key bindings for tmux compatibility
# Send proper escape sequences that tmux will recognize
[[keyboard.bindings]]
key = "Key1"
mods = "Control"
chars = "\u001b[49;5u"

[[keyboard.bindings]]
key = "Key2"
mods = "Control"
chars = "\u001b[50;5u"

[[keyboard.bindings]]
key = "Key3"
mods = "Control"
chars = "\u001b[51;5u"

[[keyboard.bindings]]
key = "Key4"
mods = "Control"
chars = "\u001b[52;5u"

[[keyboard.bindings]]
key = "Key5"
mods = "Control"
chars = "\u001b[53;5u"

[[keyboard.bindings]]
key = "Key6"
mods = "Control"
chars = "\u001b[54;5u"

[[keyboard.bindings]]
key = "Key7"
mods = "Control"
chars = "\u001b[55;5u"

[[keyboard.bindings]]
key = "Key8"
mods = "Control"
chars = "\u001b[56;5u"

[[keyboard.bindings]]
key = "Key9"
mods = "Control"
chars = "\u001b[57;5u"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
chars = "\u001b[48;5u"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# Map Super+Shift+H/L for tmux window swapping
[[keyboard.bindings]]
key = "H"
mods = "Super|Shift"
chars = "\u001b[25~"

[[keyboard.bindings]]
key = "L"
mods = "Super|Shift"
chars = "\u001b[26~"

# DISABLED 2026-07-29. These mapped Super+H/L to the F13/F14 escape sequences
# for an old tmux setup, but nothing consumes them any more - the current
# ~/.tmux.conf has no user-keys and no [27~/[28~ bindings, and neither does
# nvim, fish or i3. Meanwhile they swallowed Super+H/L before herdr could see
# them, so herdr's next_tab/previous_tab bindings never fired.
# Re-enable only if you also restore the tmux side that reads F13/F14.
