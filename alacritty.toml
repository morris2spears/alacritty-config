[terminal.shell]
program = "/usr/bin/fish"

[font]
normal.family = "CaskaydiaCove Nerd Font Mono"
normal.style = "Regular"
size = 13.0

# Key bindings for tmux compatibility
# Send proper escape sequences that tmux will recognize
[[keyboard.bindings]]
key = "Key1"
mods = "Control"
chars = "\u001b[49;5u"

[[keyboard.bindings]]
key = "Key2"
mods = "Control"
chars = "\u001b[50;5u"

[[keyboard.bindings]]
key = "Key3"
mods = "Control"
chars = "\u001b[51;5u"

[[keyboard.bindings]]
key = "Key4"
mods = "Control"
chars = "\u001b[52;5u"

[[keyboard.bindings]]
key = "Key5"
mods = "Control"
chars = "\u001b[53;5u"

[[keyboard.bindings]]
key = "Key6"
mods = "Control"
chars = "\u001b[54;5u"

[[keyboard.bindings]]
key = "Key7"
mods = "Control"
chars = "\u001b[55;5u"

[[keyboard.bindings]]
key = "Key8"
mods = "Control"
chars = "\u001b[56;5u"

[[keyboard.bindings]]
key = "Key9"
mods = "Control"
chars = "\u001b[57;5u"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
chars = "\u001b[48;5u"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001b[13;2u"

# Map Super+Shift+H/L for tmux window swapping
[[keyboard.bindings]]
key = "H"
mods = "Super|Shift"
chars = "\u001b[25~"

[[keyboard.bindings]]
key = "L"
mods = "Super|Shift"
chars = "\u001b[26~"

# Map Super+H/L for tmux pane/window switching
[[keyboard.bindings]]
key = "H"
mods = "Super"
chars = "\u001b[27~"

[[keyboard.bindings]]
key = "L"
mods = "Super"
chars = "\u001b[28~"
