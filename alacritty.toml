# Profile for every NORMAL terminal on this box (i3 $mod+Return, etc).
#
# Shared settings + the tmux escape-sequence key bindings. The FirstMate/herdr
# window uses herdr.toml instead, which imports base.toml only -- see the long
# comment at the top of tmux-keys.toml for why the two must differ.
#
# Keep real settings in base.toml, not here, so both profiles stay in sync.

[general]
import = [
  "~/.config/alacritty/base.toml",
  "~/.config/alacritty/tmux-keys.toml",
]
